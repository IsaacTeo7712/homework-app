workflows:
  ios-unsigned:
    name: iPhone app (unsigned)
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      groups:
        - homework_feed
      flutter: stable
      xcode: latest
    scripts:
      - name: Create iOS project files
        script: flutter create --platforms=ios --org com.isaacteo --project-name homework_app .
      - name: Set app name on the Home Screen
        script: /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Homework" ios/Runner/Info.plist
      - name: Get packages
        script: flutter pub get
      - name: Build (unsigned)
        script: flutter build ios --release --no-codesign --dart-define=FEED_URL="$FEED_URL"
      - name: Package .ipa
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Homework.ipa Payload
          ls -lh Homework.ipa
    artifacts:
      - Homework.ipa
